<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Inkling</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3A8C"/>
      <stop offset="1" stop-color="#1E2A6B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#ink)"/>

  <!--
    Small-size variant of the mark (16/24px). Same silhouette as logo.svg, but
    the mouth, cheeks and eye highlights are dropped and the droplet is scaled
    up — at this size those details render as grey mush rather than a face.
  -->
  <g transform="translate(31.5, 12) scale(1.15)">
    <path
      d="M60 10 C 90 45, 105 70, 105 95 C 105 120, 85 140, 60 140 C 35 140, 15 120, 15 95 C 15 70, 30 45, 60 10 Z"
      fill="#FFF6EC"/>

    <circle cx="43" cy="96" r="11" fill="#1E2A6B"/>
    <circle cx="77" cy="96" r="11" fill="#1E2A6B"/>
  </g>
</svg>

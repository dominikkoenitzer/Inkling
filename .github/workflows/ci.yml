name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      release_url:
        # Points the release check at a pre-release before it becomes the latest one.
        description: Release download folder for the Mac install check
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # --ignore-scripts skips the electron/better-sqlite3 native postinstall: none of
      # typecheck, test, or build load the native module, so CI stays fast and reliable.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  smoke:
    name: Smoke (end to end)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unlike the job above, this one runs the app. Bun does not run electron's postinstall
      # on a clean CI install, so the binary is fetched explicitly, and install-app-deps then
      # builds better-sqlite3 against that Electron.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Build native modules for Electron
        run: bun run postinstall

      - name: Build
        run: bun run build

      # Electron needs a display even when the window is only captured and closed.
      - name: Smoke test
        run: xvfb-run --auto-servernum bun run smoke

      # The MCP server talked to over stdio, as an assistant app does, next to the open app.
      - name: MCP check
        run: xvfb-run --auto-servernum bun run mcp:smoke

  titlebar:
    name: Title bar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # node-gyp needs distutils, gone in Python 3.12+.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Build native modules for Electron
        run: bun run postinstall

      - name: Build
        run: bun run build

      - name: Title bar check
        if: runner.os != 'Linux'
        run: bun run titlebar
        env:
          TITLEBAR_SHOTS: titlebar-shots

      - name: Title bar check
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run titlebar
        env:
          TITLEBAR_SHOTS: titlebar-shots

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titlebar-${{ runner.os }}
          path: titlebar-shots
          retention-days: 14

  # The Mac install routes on a real Mac runner: the public release as a browser gets it, then this
  # build through the install command from a clean state, then this build as a browser gets it.
  mac-install:
    name: Mac install
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # electron-builder skips all signing in pull request builds unless told otherwise. The ad-hoc signature needs no secret.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # node-gyp needs distutils, which Python 3.12 removed.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: The current release, before
        run: sh scripts/mac-install-check.sh release
        env:
          INKLING_RELEASE_URL: ${{ inputs.release_url }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package (universal dmg and zip)
        run: bunx electron-builder --mac dmg zip --universal --publish never

      - name: Check the signature
        run: sh scripts/mac-install-check.sh built

      - name: Install command
        run: sh scripts/mac-install-check.sh install

      - name: This build from a browser, after
        run: sh scripts/mac-install-check.sh browser

      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Download page on a Mac
        run: sh scripts/mac-install-check.sh shots

      - name: Keep the logs and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-install
          path: |
            ${{ runner.temp }}/mac-install/*.png
            ${{ runner.temp }}/mac-install/*.txt
            ${{ runner.temp }}/mac-install/*.log
          if-no-files-found: ignore
